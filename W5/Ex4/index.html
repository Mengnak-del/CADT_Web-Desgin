<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="container_item sidebar">
            <div class="sidebar_item"><img src="../Picture/logo.png" alt="picture"></div>
            <div class="sidebar_item">Item</div>
            <div class="sidebar_item">Item</div>
            <div class="sidebar_item">Item</div>
            <div class="sidebar_item">Item</div>
            <div class="sidebar_item">Item</div>
        </div>
        <div class="container_item main">
            <div><p>Dashboard</p></div>
            <div class="welcome">Welcome</div>
            <div class="DataShow">
                <div class="LatestResult">LatestResult</div>
                <div class="TimeSpending">TimeSpending</div>
            </div>
            <div>
                <p>Your courses</p>
                <button>More -></button>
            </div>
            <div class="Course">
                <div>Coruse</div>
                <div>Coruse</div>
                <div>Coruse</div>
                <div>Coruse</div>
                <div>Coruse</div>
            </div>
        </div>
        <div class="container_item profile">
            <div>
                <p>Profile</p>
                <button>-></button>
            </div>
            <div class="profile_picture">
                <img src="" alt="">
                <div class="Name"></div>
            </div>
            <div class="languse_level_show">
                <div>English</div>
                <div>Spanish</div>
            </div>
            <div>
                <p>Reminder</p>
                <img src="" alt="">
            </div>
            <div class="reminder">
                <div class="reminder_item">item</div>
                <div class="reminder_item">item</div>
                <div class="reminder_item">item</div>
            </div>
        </div>
    </div>
</body>
</html>
